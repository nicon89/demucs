# HTDemucs training recipe mixing L1 + multi-resolution STFT + SI-SDR losses.

defaults:
  - htdemucs_6s

optim:
  loss: hybrid
  mrstft:
    fft_sizes: [1024, 2048, 4096]
    hop: 256
    win_length: 2048
    power: 2.0
    weight: 0.5
  sisdr:
    weight: 0.2

weights: [1.1, 1.0, 1.0, 1.3, 1.4, 0.9]
