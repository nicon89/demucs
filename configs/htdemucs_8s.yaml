# Eight-stem HTDemucs variant with dedicated strings and keys heads.

defaults:
  - htdemucs_6s

htdemucs:
  sources: [vocals, drums, bass, guitar, piano, keys, strings, other]
  channels: 56
  channels_time: 14
  multi_freqs: [4096, 2048, 1024]
  hybrid: true
  transformer_depth: 2

optim:
  loss: hybrid
  mrstft:
    fft_sizes: [1024, 2048, 4096]
    hop: 256
    win_length: 2048
    weight: 0.6
  sisdr:
    weight: 0.25

augment:
  eq_tilt:
    proba: 0.5
    gain: 3.0
  pitch:
    proba: 0.3
    cents: 20
  stretch:
    proba: 0.3
    min: 0.97
    max: 1.03
